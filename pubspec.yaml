name: akeli
description: "Akeli V1 — Application de nutrition et recettes africaines"
publish_to: 'none'
version: 1.0.1+107

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — Riverpod par domaine fonctionnel
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.6.1

  # Navigation — GoRouter avec auth guards
  go_router: ^14.2.7

  # Supabase — local dev instance
  supabase_flutter: ^2.12.0

  # Fonts — Nunito
  google_fonts: ^6.2.1

  # Images
  cached_network_image: ^3.3.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  image_picker: ^1.1.2

  # UI helpers
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3

  # Graphes nutrition
  fl_chart: ^0.68.0

  # Internationalisation
  intl: ^0.20.2


  # Tracking — visibility detection for recipe impression events
  visibility_detector: ^0.4.0

  # Utils
  timeago: ^3.6.1
  collection: ^1.18.0
  logger: ^2.3.0

  # Icons
  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  phosphoricons_flutter: ^1.0.0
  url_launcher: ^6.3.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.4
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

dependency_overrides:
  path_provider_foundation: '>=2.3.2 <2.6.0'

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/app_icon.png"
  android: true
  ios: true
