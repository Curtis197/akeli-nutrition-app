name: Deploy to Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        # TODO: pin to a full commit SHA for supply-chain safety, e.g.:
        # uses: subosito/flutter-action@fd3edaa90ed1ba551a98a3d103e26ae8b35d9a5f  # v2.x
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/akeli-release.keystore

      - name: Create key.properties
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PWD"
            printf 'keyPassword=%s\n' "$KEY_PWD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=akeli-release.keystore\n'
          } > android/key.properties

      - name: Build release AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload to Google Play (internal track)
        # TODO: pin to a full commit SHA for supply-chain safety, e.g.:
        # uses: r0adkll/upload-google-play@8de0ac3a48d5571e741a9e263f9c91f7e87a7a43  # v1.x
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.akeli.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ github.run_number }}
